[project]
name = "ner_20260608"
version = "0.1.0"
description = "Experimental NER approach for creating graphs"
authors = [
    {name = "Will Ware", email = "will.ware@gmail.com"},
]
dependencies = ["httpx>=0.28.1", "dotenv>=0.9.9", "pydantic>=2.0"]
requires-python = ">=3.14"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"
includes = [
    "src/ner_20260608/**/*.py",
    "src/ner_20260608/data/*.jsonl",
    "src/graph.py",
    "src/loader.py",
]

[dependency-groups]
dev = [
    "build>=1.5.0",
]
